# Analyse statique, tests, puis builds Android et iOS, à chaque push sur
# main et sur chaque pull request. Aucun secret nécessaire : les builds
# ne sont pas signés (APK signé avec la clé de debug, iOS sans signature)
# et servent seulement à vérifier que l'app compile sur chaque plateforme.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un nouveau push sur la même branche annule le run précédent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyse et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupération du code
        uses: actions/checkout@v6

      - name: Installation de Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version de Flutter
        run: flutter --version

      - name: Dépendances
        run: flutter pub get

      # Fichiers générés non versionnés : textes traduits (lib/l10n/gen)
      # et code Drift (*.g.dart).
      - name: Textes traduits
        run: flutter gen-l10n

      - name: Code Drift
        run: dart run build_runner build

      # --fatal-infos : la moindre remarque du linter fait échouer le run,
      # pour garder une analyse à zéro avertissement.
      - name: Analyse statique
        run: flutter analyze --fatal-infos

      - name: Tests
        run: flutter test

  build-android:
    name: Build Android
    needs: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build
      # Sans android/key.properties, la release est signée avec la clé
      # de debug (voir android/app/build.gradle.kts) : l'APK n'est pas
      # publiable, mais la compilation complète est vérifiée.
      - name: APK release
        run: flutter build apk --release

  build-ios:
    name: Build iOS (sans signature)
    needs: analyze-and-test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build
      # --no-codesign : aucun certificat Apple nécessaire. Le résultat ne
      # s'installe pas sur un iPhone, il prouve seulement que le projet
      # iOS compile (dépendances CocoaPods, version minimale, Firebase).
      - name: App iOS release
        run: flutter build ios --release --no-codesign
