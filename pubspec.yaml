name: cartodex
description: "Cartodex — suivi de collection Pokémon TCG Pocket."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0

  # Injection de dépendances
  get_it: ^9.3.0

  # Gestion fonctionnelle des erreurs (Either<Failure, T>)
  dartz: ^0.10.1

  # Appels réseau (API TCGdex)
  http: ^1.2.2
  connectivity_plus: ^7.3.1

  # Persistance locale
  drift: ^2.20.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.4
  path: ^1.9.0

  # Identifiants uniques globalement (comptes) : nécessaire dès qu'un
  # même compte peut être créé hors-ligne sur plusieurs appareils
  # avant synchronisation — un entier auto-incrémenté local pourrait
  # entrer en collision.
  uuid: ^4.6.0

  # Compte applicatif et synchronisation cloud (Firebase)
  firebase_core: ^4.4.0
  firebase_auth: ^6.4.0
  google_sign_in: ^7.2.0
  # Utilisé à l'étape suivante (moteur de synchronisation) : ajouté
  # dès maintenant pour n'avoir qu'un seul `flutter pub get` à faire.
  cloud_firestore: ^6.1.2

  # Affichage des images distantes (logos de sets, illustrations)
  cached_network_image: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  drift_dev: ^2.20.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/timerball.png"  
  min_sdk_android: 21 
  adaptive_icon_background: "#b1c9c9"
  adaptive_icon_foreground: "assets/icons/timerball.png"