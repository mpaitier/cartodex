name: cartodex
description: "Cartodex — suivi de collection Pokémon TCG Pocket."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Injection de dépendances
  get_it: ^7.7.0

  # Gestion fonctionnelle des erreurs (Either<Failure, T>)
  dartz: ^0.10.1

  # Appels réseau (API TCGdex)
  http: ^1.2.2
  connectivity_plus: ^6.0.5

  # Persistance locale
  drift: ^2.20.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Affichage des images distantes (logos de sets, illustrations)
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  drift_dev: ^2.20.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/timerball.png"  
  min_sdk_android: 21 
  adaptive_icon_background: "#b1c9c9"
  adaptive_icon_foreground: "assets/icons/timerball.png" 
